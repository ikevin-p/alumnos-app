# =============================================================================
# INNOVATECH CHILE — alumnos-datos/.github/workflows/ci.yml
# Pipeline: Build imagen PostgreSQL personalizada → Push ECR → Deploy EC2
# Trigger: push a la rama deploy
# =============================================================================

name: "Database CI/CD"

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG:  ${{ github.sha }}

jobs:
  build-and-deploy:
    name: "Build PostgreSQL → ECR → EC2"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout código"
        uses: actions/checkout@v4

      - name: "Configurar credenciales AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: "Login en Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Build y Push imagen PostgreSQL a ECR"
        env:
          ECR_DATOS_URI: ${{ secrets.ECR_DATOS_URI }}
        run: |
          docker build \
            --tag $ECR_DATOS_URI:$IMAGE_TAG \
            --tag $ECR_DATOS_URI:latest \
            .
          docker push $ECR_DATOS_URI:$IMAGE_TAG
          docker push $ECR_DATOS_URI:latest
          echo "✅ Imagen DB publicada: $ECR_DATOS_URI:latest"

      - name: "Deploy PostgreSQL en EC2-Datos via SSM"
        env:
          ECR_DATOS_URI:  ${{ secrets.ECR_DATOS_URI }}
          EC2_DATOS_ID:   ${{ secrets.EC2_DATOS_ID }}
        run: |
          aws ssm send-command \
            --instance-ids "$EC2_DATOS_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DB - $IMAGE_TAG" \
            --parameters commands="[
              'aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_DATOS_URI',
              'sudo docker pull $ECR_DATOS_URI:latest',
              'sudo docker stop alumnos-datos 2>/dev/null || true',
              'sudo docker rm   alumnos-datos 2>/dev/null || true',
              'sudo docker network create alumnos-network 2>/dev/null || true',
              'sudo docker run -d --name alumnos-datos --restart unless-stopped --network alumnos-network -e POSTGRES_DB=alumnos -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -v pgdata:/var/lib/postgresql/data -p 5432:5432 $ECR_DATOS_URI:latest',
              'sleep 5 && sudo docker ps | grep alumnos-datos'
            ]" \
            --region "$AWS_REGION" \
            --output text
