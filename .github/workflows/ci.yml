name: "Backend CI/CD"

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG:  ${{ github.sha }}

jobs:
  build-and-push:
    name: "Build Spring Boot → ECR"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout código"
        uses: actions/checkout@v4

      - name: "Configurar credenciales AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: "Login en Amazon ECR"
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Build y Push imagen Backend"
        env:
          ECR_APP_URI: ${{ secrets.ECR_APP_URI }}
        run: |
          docker build \
            --tag $ECR_APP_URI:$IMAGE_TAG \
            --tag $ECR_APP_URI:latest \
            .
          docker push $ECR_APP_URI:$IMAGE_TAG
          docker push $ECR_APP_URI:latest

  deploy:
    name: "Deploy Backend en EC2"
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: "Configurar credenciales AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: "Deploy Backend en EC2 via SSM"
        env:
          ECR_APP_URI: ${{ secrets.ECR_APP_URI }}
          EC2_APP_ID:  ${{ secrets.EC2_APP_ID }}
        run: |
          aws ssm send-command \
            --instance-ids "$EC2_APP_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Backend - $IMAGE_TAG" \
            --parameters commands="[
              'aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_APP_URI',
              'sudo docker pull $ECR_APP_URI:latest',
              'sudo docker stop alumnos-app 2>/dev/null || true',
              'sudo docker rm   alumnos-app 2>/dev/null || true',
              'sudo docker network create alumnos-network 2>/dev/null || true',
              'sudo docker run -d --name alumnos-app --restart unless-stopped --network alumnos-network -p 8080:8080 -e SPRING_DATASOURCE_URL=jdbc:postgresql://alumnos-datos:5432/alumnos -e SPRING_DATASOURCE_USERNAME=postgres -e SPRING_DATASOURCE_PASSWORD=postgres $ECR_APP_URI:latest',
              'sudo docker image prune -f'
            ]" \
            --region "$AWS_REGION" \
            --output text