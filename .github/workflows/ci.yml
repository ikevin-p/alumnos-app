name: Backend CI/CD

on:
  push:
    branches: [ deploy ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: alumnos-app
  ECR_REGISTRY: 932111883716.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y subir imagen Docker a ECR
        run: |
          IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Desplegar en EC2-App via SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-0d55f1dfb3bb7734c" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 932111883716.dkr.ecr.us-east-1.amazonaws.com && docker pull 932111883716.dkr.ecr.us-east-1.amazonaws.com/alumnos-app:latest && docker stop alumnos-app 2>/dev/null || true && docker rm alumnos-app 2>/dev/null || true && docker run -d --name alumnos-app -p 8080:8080 -e SPRING_DATASOURCE_URL=jdbc:postgresql://10.0.1.234:5432/alumnos -e SPRING_DATASOURCE_USERNAME=postgres -e SPRING_DATASOURCE_PASSWORD=postgres 932111883716.dkr.ecr.us-east-1.amazonaws.com/alumnos-app:latest"]' \
            --region us-east-1
